server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: lingkan-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  threads:
    virtual:
      enabled: true
  # 定时任务线程池：至少 2 个，避免每日同步与其他调度互相阻塞
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: lingkan-sched-
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

lingkan:
  # 第三方数据采集总开关（分钟级行情轮询）。全市场同步使用下面的 stock-sync 开关，两者独立。
  sync:
    enabled: false
  # 全市场股票数据同步（股票清单 + 行情 + 全部启用指标绑定）
  stock-sync:
    # 定时任务开关。关闭后定时任务不执行，手动接口仍可用（便于排障）
    enabled: true
    # 每天凌晨 04:00（北京时间），不受服务器时区影响
    cron: "0 0 4 * * ?"
    timezone: Asia/Shanghai
    # 股票基础信息批量入库条数
    batch-size: 500
    # 禁止每次启动自动执行 FULL（首次初始化请手动调用接口）
    auto-initialize: false
    # 股票清单取数：主源东方财富，失败时回退新浪（新浪不返回行业字段）
    stock-list:
      provider: eastmoney
      fallback: sina
      page-size: 100
      max-pages: 120
      request-interval-ms: 300
      max-retries: 3
      retry-interval-ms: 2000
      min-stock-count: 3000
      hosts: push2.eastmoney.com,82.push2.eastmoney.com,push2delay.eastmoney.com
    # 行情同步（腾讯批量，GBK 解码）
    quote:
      enabled: true
      provider: tencent
      batch-size: 100
      max-retries: 3
      retry-interval-ms: 1000
    # 东方财富指标同步：单股快照一次返回全部绑定指标，走有界并发
    eastmoney:
      enabled: true
      concurrency: 6
      request-interval-ms: 150
      max-retries: 2
      retry-interval-ms: 800
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2
    task:
      # 任务锁超时（分钟），超时后允许新任务抢占，服务异常退出无需人工清锁
      lock-timeout-minutes: 120
      detail-log-enabled: true
  # 分红/财务同步（自选股分红方案 + 财报，支撑首页看板股息率 TTM 与 PE TTM）
  dividend-financial-sync:
    # 定时任务开关。关闭后定时任务不执行，手动接口与添加自选触发仍可用
    enabled: true
    # 每天凌晨 05:30（北京时间），不受服务器时区影响
    cron: "0 30 5 * * ?"
    timezone: Asia/Shanghai
    # 相邻两次数据源请求的最小间隔（毫秒）
    request-interval-ms: 500
  # 首页看板（目标价格档位等）
  board:
    # 目标股息率档位（%），对应看板 9 档目标价列
    target-yields: 4.0,4.5,5.0,5.5,6.0,6.5,7.0,7.5,8.0
  datasource:
    # 单用户配置维度，未登录时使用该用户标识（不做注册登录体系）
    default-user-id: local-user
  market:
    # 交易时段判断使用的时间区间
    session:
      morning-open: "09:30"
      morning-close: "11:30"
      afternoon-open: "13:00"
      afternoon-close: "15:00"
  cors:
    allowed-origins: "*"

logging:
  level:
    root: INFO
    com.lingkan: INFO
    com.lingkan.datasource: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId}] %logger{36} - %msg%n"
