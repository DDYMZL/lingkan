# 玲看股息 LingKan - 容器编排
# 使用： cp .env.example .env && ./scripts/start.sh
name: lingkan

services:
  opengauss:
    image: ${OPENGAUSS_IMAGE:-enmotech/opengauss:5.0.0}
    container_name: lingkan-opengauss
    restart: unless-stopped
    privileged: true
    environment:
      GS_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - opengauss-data:/var/lib/opengauss
      - ./opengauss/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "su - omm -c \"gsql -d postgres -p 5432 -c 'select 1'\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - lingkan-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: lingkan/backend:${APP_VERSION:-1.0.0}
    container_name: lingkan-backend
    restart: unless-stopped
    depends_on:
      opengauss:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      LINGKAN_DB_URL: jdbc:opengauss://opengauss:5432/${DB_NAME:-lingkan}?currentSchema=public
      LINGKAN_DB_USER: ${DB_USER:-gaussdb}
      LINGKAN_DB_PASSWORD: ${DB_PASSWORD}
      LINGKAN_SYNC_ENABLED: ${LINGKAN_SYNC_ENABLED:-false}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - lingkan-net

  nginx:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    container_name: lingkan-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - lingkan-net

volumes:
  opengauss-data:
    name: lingkan-opengauss-data
  nginx-logs:
    name: lingkan-nginx-logs

networks:
  lingkan-net:
    name: lingkan-net
    driver: bridge
